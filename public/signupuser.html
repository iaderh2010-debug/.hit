<!DOCTYPE html>
<html>
<head><title>Sign Up as User</title></head>
<body>
  <h2>Registrarse como Usuario</h2>
  <form method="POST" action="/signupuser">
    <label>Usuario: <input type="text" name="username" required></label><br>
    <label>Contraseña: <input type="password" name="password" required></label><br>
    <button type="submit">Registrarse como Usuario</button>
  </form>
  <a href="/loginuser.html">¿Ya tienes cuenta? Inicia sesión</a>
</body>
</html>
