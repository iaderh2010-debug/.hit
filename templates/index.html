  <div id="linkToUserModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="close-link-user-modal">&times;</span>
      <h3>Compartir con usuario</h3>
      <input type="text" id="link-user-username" placeholder="Nombre de usuario del usuario" />

      <div id="linkUserMsg" style="margin-top:10px;color:red;"></div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Show logged in user
  var meta = document.querySelector('meta[name="current-username"]');
  var username = meta ? meta.content : '';
  if (username) {
    document.getElementById('loggedInSection').textContent = 'Logged in as ' + username;
  }

  // Link to user modal logic
  const linkBtn = document.getElementById('linkToUserBtn');
  const modal = document.getElementById('linkToUserModal');
  const closeModal = document.getElementById('close-link-user-modal');
  const sendBtn = document.getElementById('sendLinkRequestBtn');
  const userInput = document.getElementById('link-user-username');
  const msg = document.getElementById('linkUserMsg');
  if (linkBtn && modal && closeModal && sendBtn && userInput) {
    linkBtn.onclick = () => { modal.classList.add('show'); userInput.value = ''; msg.textContent = ''; };
    closeModal.onclick = () => { modal.classList.remove('show'); };
    window.onclick = (e) => { if (e.target === modal) modal.classList.remove('show'); };
    sendBtn.onclick = () => {
      const username = userInput.value.trim();
      if (!username) { msg.textContent = 'Por favor, escribe un nombre de usuario.'; return; }
      fetch('/request-share', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: username })
      })
      .then(res => res.json())
      .then(data => {
        msg.style.color = data.status === 'ok' ? 'green' : 'red';
        msg.textContent = data.message;
        if (data.status === 'ok') setTimeout(() => { modal.classList.remove('show'); }, 1500);
      })
      .catch(() => { msg.textContent = 'Error de red.'; });
    };
  }

  // Unlink from user logic
  const unlinkBtn = document.getElementById('unlinkFromUserBtn');
  if (unlinkBtn) {
    unlinkBtn.onclick = function() {
      const user = prompt('Escribe el nombre de usuario del usuario a desvincular:');
      if (!user) return;
      if (!confirm('¿Seguro que quieres desvincular la solicitud de este usuario?')) return;
      fetch('/cancel-share', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ designer: null, user })
      })
        .then(res => res.json())
        .then(data => {
          alert(data.message);
          // Optionally, clear the workspace area or reload to show blank layout
          location.reload();
        })
        .catch(() => alert('Error al desvincular.'));
    };
  }
});
</script>
